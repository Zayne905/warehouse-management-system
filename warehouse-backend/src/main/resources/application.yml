
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/warehouse_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: AUTO
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: d2FyZWhvdXNlLWp3dC1zZWNyZXQta2V5LWZvci1oczI1Ni1hbGdvcml0aG0tMTIzNDU2Nzg5MA==
  expiration: 86400000

# AI / LLM configuration
ai:
  llm:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${AI_API_KEY:sk-8876578554a2421db97212635ed25597}
    model: qwen-plus
    # Max tokens per response
    max-tokens: 4096
    # Temperature (0-2), lower = more deterministic
    temperature: 0.7
    # System prompt for the AI warehouse manager role
    system-prompt: |
      你是仓储管理系统的AI助手"小仓"，负责帮助用户查询库存、订单、看板等信息。
      你可以使用提供的工具函数来查询实时数据。回答时：
      - 使用中文回复
      - 数据要准确，基于工具返回的实际数据
      - 如果工具返回的数据不足以回答问题，如实告知用户
      - 对数据进行简要解读和分析，不要只罗列数字
      - 当用户问及趋势或汇总时，优先使用分析类工具
      - 库存预警：你可以查询哪些零件库存低于最低储备（低储预警）或高于最高储备（高储预警）。当用户询问"库存预警""哪些零件需要补货""哪些零件库存过高""库存异常"时，使用 get_inventory_alerts 工具。预警基于每种物料自身配置的高低储阈值（minStock/maxStock），0表示未配置。分析时应提醒用户低储零件需尽快补货，高储零件应暂停采购优先消耗。
